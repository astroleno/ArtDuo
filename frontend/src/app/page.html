<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtDuo - 沉浸画廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅色主题变量 */
            --bg-primary: #f5f5f4;
            --bg-secondary: #e7e5e4;
            --bg-tertiary: #d6d3d1;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #78716c;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.12);
            --btn-primary: linear-gradient(135deg, #1c1917 0%, #44403c 100%);
            --btn-text: #f5f5f4;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --footer-bg: transparent;
            --footer-text: #1c1917;
        }

        [data-theme="dark"] {
            /* 深色主题变量 */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #808080;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-primary: linear-gradient(135deg, #f5f5f4 0%, #e7e5e4 100%);
            --btn-text: #1c1917;
            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: rgba(255, 255, 255, 0.2);
            --modal-bg: #2d2d2d;
            --footer-bg: transparent;
            --footer-text: #d6d3d1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .gallery-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .gallery-lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent, rgba(68,64,60,0.1));
        }

        .header {
            padding: 2rem 0;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .header p {
            font-size: 1.03125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            width: 100%;
        }

        .guide-question {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-primary);
            margin-bottom: 2rem;
            line-height: 1.4;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        .flip-link {
            position: relative;
            display: block;
            overflow: hidden;
            white-space: nowrap;
            cursor: pointer;
            line-height: 1;
            text-align: center;
            width: 100%;
            max-width: 100%;
        }

        .flip-rows {
            position: relative;
            display: block;
            width: 100%;
            text-align: center;
        }

        .flip-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 0;
            font-variant-ligatures: none;
            backface-visibility: hidden;
            width: 100%;
            text-align: center;
        }

        .flip-row--next {
            position: absolute;
            inset: 0;
        }

        .flip-row span {
            display: inline-block;
            transform: translateY(0);
            transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
            transition-delay: calc(var(--flip-index, 0) * 0.08s);
            will-change: transform;
            min-width: 1em;
        }

        .flip-row--next span {
            transform: translateY(110%);
        }

        .flip-link.is-flipping .flip-row--current span {
            transform: translateY(-110%);
        }

        .flip-link.is-flipping .flip-row--next span {
            transform: translateY(0);
        }

        .input-container {
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .emotion-input {
            width: 100%;
            max-width: 400px;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: 2px solid var(--input-border);
            border-radius: 0.75rem;
            background: var(--input-bg);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            transition: all 0.3s ease;
            margin: 0 auto;
            display: block;
        }

        .emotion-input:focus {
            outline: none;
            border-color: var(--text-tertiary);
            background: var(--input-bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .emotion-input::placeholder {
            color: var(--text-tertiary);
        }

        .submit-button {
            margin-top: 1.5rem;
            padding: 0.875rem 2rem;
            background: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-secondary);
            margin-top: 1.25rem;
            font-family: 'Inter', sans-serif;
        }

        .footer {
            padding: 1rem 0;
            position: relative;
            z-index: 10;
            background-color: var(--footer-bg);
            color: var(--footer-text);
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            text-align: center;
        }

        .footer p {
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        @media (max-width: 768px) {
            .guide-question {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .emotion-input {
                font-size: 1rem;
                padding: 0.875rem 1.25rem;
            }

            .header {
                padding: 1rem;
            }

            .main-content {
                padding: 1rem;
            }

        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-lighting"></div>

        <header class="header">
            <h1>ArtDuo</h1>
            <p>沉浸画廊 · 探索之旅</p>
        </header>

        <main class="main-content">
            <div class="content-wrapper">
                <div class="guide-question" id="guide-question">
                    <span class="flip-link" id="flip-question" role="button" tabindex="0"></span>
                </div>

                <div class="input-container">
                    <input
                        type="text"
                        class="emotion-input"
                        id="emotion-input"
                        placeholder="描述你的情绪..."
                        maxlength="50"
                    >
                    <button class="submit-button" id="submit-button">
                        开始艺术之旅
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>LessLand · ArtDuo</p>
            </div>
        </footer>
    </div>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" title="切换主题">
        <span id="theme-icon">●</span>
    </button>

    <script>
        class HomePage {
            constructor() {
                this.emotionInput = document.getElementById('emotion-input');
                this.submitButton = document.getElementById('submit-button');
                this.themeToggle = document.getElementById('theme-toggle');
                this.themeIcon = document.getElementById('theme-icon');

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.initTheme();
                this.focusInput();
            }

            initTheme() {
                const savedTheme = localStorage.getItem('theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                this.setTheme(savedTheme);
            }

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                this.setTheme(newTheme);
            }

            setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                this.themeIcon.textContent = theme === 'dark' ? '○' : '●';
            }

            setupEventListeners() {
                // Submit button click
                this.submitButton.addEventListener('click', () => {
                    this.submitEmotion();
                });

                // Enter key press
                this.emotionInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.submitEmotion();
                    }
                });

                // Theme toggle
                this.themeToggle.addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Input animation
                this.emotionInput.addEventListener('input', () => {
                    if (this.emotionInput.value.trim()) {
                        this.submitButton.style.opacity = '1';
                        this.submitButton.style.transform = 'translateY(0)';
                    } else {
                        this.submitButton.style.opacity = '0.7';
                    }
                });
            }

            focusInput() {
                // Auto-focus on desktop
                if (window.innerWidth > 768) {
                    setTimeout(() => {
                        this.emotionInput.focus();
                    }, 1000);
                }
            }

            async generateSubtitleAndNavigate(emotion) {
                try {
                    // 先跳转到gallery页面进行策展，然后自动跳转到immersive
                    window.location.href = `/gallery?emotion=${encodeURIComponent(emotion)}&autoImmersive=true`;
                } catch (error) {
                    console.error('跳转失败:', error);
                    // 如果出错，直接跳转到沉浸式页面
                    window.location.href = `/gallery/immersive?emotion=${encodeURIComponent(emotion)}`;
                }
            }

            async submitEmotion() {
                const emotion = this.emotionInput.value.trim();

                if (!emotion) {
                    this.emotionInput.focus();
                    this.emotionInput.style.borderColor = '#ef4444';
                    setTimeout(() => {
                        this.emotionInput.style.borderColor = 'var(--input-border)';
                    }, 2000);
                    return;
                }

                // Navigate directly to immersive gallery with emotion parameter
                // 先调用LLM生成副标题，然后跳转
                this.generateSubtitleAndNavigate(emotion);
            }
        }


        // Simple flip text implementation
        const questions = [
            '此刻你是何种颜色？',
            '你的心像圆还是碎片？',
            '今天属于冷色还是暖调？',
            '心绪更像山脊还是海浪？',
            '现在的你是线条还是涂抹？',
            '若是旋律，你轻快吗？',
            '今天，你的心声像什么？',
            '现在像耳语还是合唱？',
            '今天闪过的光点是什么？',
            '你更像晨光还是夜色？',
            '你的心情像风还是雨？',
            '此刻是一句怎样的诗？',
            '今天，你更像火还是水？',
            '若添一件作品，会是什么？',
            '此刻的你，会在想些什么？'
        ];

        let currentQuestionIndex = Math.floor(Math.random() * questions.length);
        let nextQuestionIndex = 0;
        let flipQuestionElement;
        let flipIntervalId;
        let isFlipping = false;

        const LETTER_FLIP_DELAY = 80; // ms between each character
        const LETTER_TRANSITION_DURATION = 420; // match CSS transition duration in ms
        const LETTER_TRANSITION_BUFFER = 120; // buffer to avoid premature DOM rebuild


        function escapeLetter(letter) {
            if (letter === '&') return '&amp;';
            if (letter === '<') return '&lt;';
            if (letter === '>') return '&gt;';
            if (letter === '"') return '&quot;';
            if (letter === "'") return '&#39;';
            if (letter === ' ') return '&nbsp;';
            if (letter === '\n') return '<br />';
            return letter || '&nbsp;';
        }


        function createFlipText(currentText, nextText) {
            const currentChars = Array.from(currentText || '');
            const nextChars = Array.from(nextText || '');

            const currentLetters = [];
            const nextLetters = [];

            // 直接处理每个字符，不添加前导空格
            for (let i = 0; i < currentChars.length; i++) {
                const currentChar = escapeLetter(currentChars[i]);
                currentLetters.push(`<span style="--flip-index: ${i};">${currentChar}</span>`);
            }

            for (let i = 0; i < nextChars.length; i++) {
                const nextChar = escapeLetter(nextChars[i]);
                nextLetters.push(`<span style="--flip-index: ${i};">${nextChar}</span>`);
            }

            return `
                <span class="flip-rows">
                    <span class="flip-row flip-row--current">${currentLetters.join('')}</span>
                    <span class="flip-row flip-row--next">${nextLetters.join('')}</span>
                </span>
            `;
        }


        function updateQuestion() {
            if (!flipQuestionElement) return;

            flipQuestionElement.classList.remove('is-flipping');

            const currentText = questions[currentQuestionIndex];
            const nextText = questions[nextQuestionIndex];

            flipQuestionElement.innerHTML = createFlipText(currentText, nextText);
        }


        function flipToNext() {
            if (!flipQuestionElement) return 0;

            const letters = flipQuestionElement.querySelectorAll('.flip-row--current span');
            if (!letters.length) return 0;

            // 移除后强制回流，保证连续触发动画
            flipQuestionElement.classList.remove('is-flipping');
            void flipQuestionElement.offsetWidth;
            flipQuestionElement.classList.add('is-flipping');

            return letters.length;
        }


        function pickNextQuestionIndex(excludeIndex) {
            if (questions.length <= 1) return excludeIndex;

            let candidate = excludeIndex;
            while (candidate === excludeIndex) {
                candidate = Math.floor(Math.random() * questions.length);
            }

            return candidate;
        }


        function nextQuestion() {
            if (isFlipping) return;

            const stackCount = flipToNext();
            if (!stackCount) return;

            isFlipping = true;

            const staggerTotal = Math.max(0, (stackCount - 1) * LETTER_FLIP_DELAY);
            const totalAnimationTime = LETTER_TRANSITION_DURATION + staggerTotal + LETTER_TRANSITION_BUFFER;
            setTimeout(() => {
                currentQuestionIndex = nextQuestionIndex;
                nextQuestionIndex = pickNextQuestionIndex(currentQuestionIndex);
                updateQuestion();
                isFlipping = false;
            }, totalAnimationTime);
        }


        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            new HomePage();
            
            
            // Initialize flip question
            flipQuestionElement = document.getElementById('flip-question');
            if (flipQuestionElement) {
                nextQuestionIndex = pickNextQuestionIndex(currentQuestionIndex);
                updateQuestion();
                
                // Auto-flip every 8 seconds
                flipIntervalId = setInterval(nextQuestion, 8000);
                
                // Manual flip on click
                flipQuestionElement.addEventListener('click', nextQuestion);
                
                // Cleanup on page unload
                window.addEventListener('beforeunload', () => {
                    clearInterval(flipIntervalId);
                });
            }
        });
    </script>
</body>
</html>
