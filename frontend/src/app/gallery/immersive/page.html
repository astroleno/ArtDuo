<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtDuo - 沉浸画廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅色主题变量 */
            --bg-primary: #f5f5f4;
            --bg-secondary: #e7e5e4;
            --bg-tertiary: #d6d3d1;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #78716c;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.12);
            --btn-primary: linear-gradient(135deg, #1c1917 0%, #44403c 100%);
            --btn-text: #f5f5f4;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --footer-bg: transparent;
            --footer-text: #1c1917;
        }

        [data-theme="dark"] {
            /* 深色主题变量 */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #808080;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-primary: linear-gradient(135deg, #f5f5f4 0%, #e7e5e4 100%);
            --btn-text: #1c1917;
            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: rgba(255, 255, 255, 0.2);
            --modal-bg: #2d2d2d;
            --footer-bg: transparent;
            --footer-text: #d6d3d1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .gallery-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .gallery-lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent, rgba(68,64,60,0.1));
        }

        .header {
            padding: 2rem 0;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            width: 100%;
        }

        .input-container {
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .submit-button {
            margin-top: 1.5rem;
            padding: 0.875rem 2rem;
            background: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
            margin-top: 0.375rem;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .gallery-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 180px);
            overflow: visible;
        }

        .carousel-wrapper {
            width: 100vw;
            height: calc(100vh - 180px);
            overflow: visible;
        }

        .carousel {
            width: 100%;
            height: 100%;
            outline: none;
            position: relative;
            overflow: visible;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .carousel-slide {
            min-width: 100vw;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 180px);
            height: calc(100vh - 180px);
            padding-bottom: 0;
            overflow: visible;
        }

        .artwork-image-container {
            flex-shrink: 0;
            margin-right: clamp(40px, 8vw, 140px);
        }

        .artwork-image-wrapper {
            position: relative;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .spotlight-effect {
            position: absolute;
            inset: -1rem;
            border-radius: 0;
            filter: blur(1rem);
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,218,185,0.3), transparent, transparent);
            transition: all 0.7s ease;
        }

        .artwork-image {
            position: relative;
            z-index: 10;
            width: clamp(280px, 35vw, 480px);
            height: clamp(350px, 43vw, 600px);
            object-fit: cover;
            border-radius: 0;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
            margin-bottom: 2rem;
            border: none;
        }

        .frame-effect {
            position: absolute;
            inset: 0;
            border-radius: 0;
            pointer-events: none;
            border: none;
        }

        .artwork-info-container {
            flex-shrink: 0;
            width: clamp(320px, 25vw, 420px);
            animation: slideInRight 0.6s ease-out 0.2s both;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .artwork-info {
            width: 100%;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            transform: scale(0.96);
        }

        .artwork-info-content {
            max-width: min(320px, 85%);
            margin: 0 auto;
            padding-top: 1.4375rem;
            padding-bottom: 1.4375rem;
        }

        .artwork-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .artwork-artist {
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .artwork-year {
            font-size: 0.625rem;
            margin-bottom: 1.25rem;
            color: var(--text-tertiary);
            transition: color 0.3s ease;
        }

        .artwork-description {
            line-height: 1.6;
            font-size: 0.625rem;
            color: var(--text-secondary);
            word-break: break-word;
            transition: color 0.3s ease;
        }

        .navigation-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 0;
            background: none;
            backdrop-filter: none;
            border-radius: 0;
            box-shadow: none;
        }

        .indicator {
            display: inline-block;
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 9999px;
            background-color: var(--text-tertiary);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            opacity: 0.7;
        }

        .indicator:hover {
            background-color: var(--text-secondary);
            transform: scale(1.15);
            opacity: 0.9;
        }

        .indicator.active {
            background-color: var(--text-primary);
            transform: scale(1.3);
            opacity: 1;
            box-shadow: none;
        }

        .footer {
            padding: 1rem 0;
            position: relative;
            z-index: 10;
            background-color: var(--footer-bg);
            color: var(--footer-text);
            margin-top: auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .footer-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            text-align: center;
        }

        .footer p {
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 1.7rem;
            height: 1.7rem;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .carousel-slide {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }

            .artwork-image-container {
                margin-right: 0;
            }

            .artwork-info-container {
                width: 100%;
                max-width: 320px;
            }

            .artwork-image {
                width: clamp(200px, 60vw, 300px);
                height: clamp(250px, 75vw, 375px);
            }

            .artwork-title {
                font-size: 1rem;
            }

            .artwork-artist {
                font-size: 0.625rem;
            }

            .artwork-description {
                font-size: 0.5625rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-lighting"></div>

        <header class="header">
            <div class="header-content">
                <h1>ArtDuo</h1>
                <p id="emotion-text">沉浸画廊 · 探索之旅</p>
            </div>
        </header>

        <div class="gallery-content">
            <div class="carousel-wrapper">
                <div class="carousel" tabindex="0" id="carousel">
                    <div class="carousel-track" id="carousel-track">
                        <!-- Slides will be dynamically generated -->
                    </div>
                </div>
            </div>

            <div class="navigation-indicators" id="indicators">
                <!-- Indicators will be dynamically generated -->
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>LessLand · ArtDuo</p>
            </div>
        </footer>
    </div>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" title="切换主题">
        <span id="theme-icon">●</span>
    </button>

    <script>
        // 画作数据
        const artworks = [
            {
                id: 'starry-night',
                title: '星夜',
                artist: '文森特·梵高',
                year: '1889',
                medium: '布面油画',
                dimensions: '73.7 × 92.1 cm',
                imageUrl: 'https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=1400&h=1050&fit=crop',
                description: '梵高在圣雷米疗养院摹写内心的夜色，将旋转星轨与温暖乡镇叠合成起伏的节奏。',
                museum: '现代艺术博物馆 · MoMA'
            },
            {
                id: 'mona-lisa',
                title: '蒙娜丽莎',
                artist: '列奥纳多·达·芬奇',
                year: '1503',
                medium: '木板油画',
                dimensions: '77 × 53 cm',
                imageUrl: 'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1400&h=1050&fit=crop',
                description: '晕涂法柔化了光影，神秘的目光与微笑牵引观者进入静默而细腻的对话。',
                museum: '卢浮宫'
            },
            {
                id: 'girl-with-pearl-earring',
                title: '戴珍珠耳环的少女',
                artist: '约翰内斯·维米尔',
                year: '1665',
                medium: '布面油画',
                dimensions: '44.5 × 39 cm',
                imageUrl: 'https://images.unsplash.com/photo-1578321272176-b7bbc0679853?w=1400&h=1050&fit=crop',
                description: '荷兰黄金时代的杰作，被称为"北方的蒙娜丽莎"。',
                museum: '莫瑞泰斯皇家美术馆'
            },
            {
                id: 'the-scream',
                title: '呐喊',
                artist: '爱德华·蒙克',
                year: '1893',
                medium: '蛋彩、油彩、粉彩',
                dimensions: '91 × 73.5 cm',
                imageUrl: 'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1400&h=1050&fit=crop',
                description: '表现主义的代表作，表达了现代人的焦虑和恐惧。',
                museum: '国家美术馆 · 奥斯陆'
            },
            {
                id: 'impression-sunrise',
                title: '日出·印象',
                artist: '克劳德·莫奈',
                year: '1872',
                medium: '布面油画',
                dimensions: '48 × 63 cm',
                imageUrl: 'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=1400&h=1050&fit=crop',
                description: '印象派运动的开山之作，描绘了勒阿弗尔港口的日出景象。',
                museum: '马蒙坦莫奈美术馆'
            }
        ];

        class ImmersiveGallery {
            constructor() {
                this.currentIndex = 0;
                this.carousel = document.getElementById('carousel');
                this.track = document.getElementById('carousel-track');
                this.indicators = document.getElementById('indicators');
                this.themeToggle = document.getElementById('theme-toggle');
                this.themeIcon = document.getElementById('theme-icon');

                // 触摸相关变量
                this.startX = 0;
                this.endX = 0;
                this.touchStartTime = 0;
                this.isDragging = false;
                this.startTranslate = 0;
                this.currentTranslate = 0;
                this.carouselWidth = 0;

                this.init();
            }

            init() {
                this.renderSlides();
                this.renderIndicators();
                this.setupEventListeners();
                this.updateCarousel();
                this.initTheme();
            }

            renderSlides() {
                this.track.innerHTML = artworks.map(artwork => `
                    <div class="carousel-slide">
                        <div class="artwork-image-container">
                            <div class="artwork-image-wrapper">
                                <div class="spotlight-effect"></div>
                                <img
                                    src="${artwork.imageUrl}"
                                    alt="${artwork.title}"
                                    class="artwork-image"
                                >
                                <div class="frame-effect"></div>
                            </div>
                        </div>
                        <div class="artwork-info-container">
                            <div class="artwork-info">
                                <div class="artwork-info-content">
                                    <h2 class="artwork-title">${artwork.title}</h2>
                                    <p class="artwork-artist">${artwork.artist}</p>
                                    <p class="artwork-year">${artwork.year}</p>
                                    <p class="artwork-description">${artwork.description}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            renderIndicators() {
                this.indicators.innerHTML = artworks.map((_, index) => `
                    <span class="indicator ${index === 0 ? 'active' : ''}" data-index="${index}" role="button" tabindex="0" aria-label="跳转到第 ${index + 1} 幅画"></span>
                `).join('');

                console.log('Navigation indicators rendered:', this.indicators.innerHTML);
            }

            setupEventListeners() {
                // 键盘导航 - 全局监听，确保一定工作
                document.addEventListener('keydown', (e) => {
                    console.log('Key pressed:', e.key); // 调试信息

                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        e.stopPropagation();

                        if (e.key === 'ArrowLeft') {
                            console.log('Going to previous slide');
                            this.prev();
                        } else {
                            console.log('Going to next slide');
                            this.next();
                        }
                    }
                }, true); // 使用捕获阶段

                // 指示器点击
                this.indicators.addEventListener('click', (e) => {
                    if (e.target.classList.contains('indicator')) {
                        const index = parseInt(e.target.dataset.index);
                        console.log('Indicator clicked:', index);
                        this.goToSlide(index);
                    }
                });

                // 指示器键盘控制
                this.indicators.addEventListener('keydown', (e) => {
                    if (e.target.classList.contains('indicator') && (e.key === 'Enter' || e.key === ' ')) {
                        e.preventDefault();
                        const index = parseInt(e.target.dataset.index);
                        console.log('Indicator activated via keyboard:', index);
                        this.goToSlide(index);
                    }
                });

                // 增强的触摸滑动支持
                this.setupTouchEvents();

                // 鼠标滚轮支持
                this.setupWheelEvents();

                // 主题切换
                this.themeToggle.addEventListener('click', () => {
                    this.toggleTheme();
                });
            }

            setupTouchEvents() {
                this.carousel.addEventListener('touchstart', (e) => {
                    this.startX = e.touches[0].clientX;
                    this.touchStartTime = Date.now();
                    this.isDragging = true;
                    this.carouselWidth = window.innerWidth;
                    this.startTranslate = -this.currentIndex * this.carouselWidth;

                    // 阻止默认行为以获得更好的控制
                    e.preventDefault();
                }, { passive: false });

                this.carousel.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;

                    const currentX = e.touches[0].clientX;
                    const diff = currentX - this.startX;
                    this.currentTranslate = this.startTranslate + diff;

                    // 应用实时拖动效果
                    this.track.style.transition = 'none';
                    this.track.style.transform = `translateX(${this.currentTranslate}px)`;

                    e.preventDefault();
                }, { passive: false });

                this.carousel.addEventListener('touchend', (e) => {
                    if (!this.isDragging) return;

                    this.isDragging = false;
                    this.endX = e.changedTouches[0].clientX;
                    const diff = this.startX - this.endX;
                    const touchDuration = Date.now() - this.touchStartTime;

                    // 计算滑动速度和距离
                    const speed = Math.abs(diff) / touchDuration;
                    const minSwipeDistance = 50;
                    const minSwipeSpeed = 0.3;

                    this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';

                    // 判断是否需要切换页面
                    if (Math.abs(diff) > minSwipeDistance || speed > minSwipeSpeed) {
                        if (diff > 0) {
                            this.next();
                        } else {
                            this.prev();
                        }
                    } else {
                        // 回到原位
                        this.updateCarousel();
                    }
                });

                // 防止触摸事件冒泡
                this.carousel.addEventListener('touchcancel', () => {
                    this.isDragging = false;
                    this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    this.updateCarousel();
                });
            }

            setupWheelEvents() {
                let wheelTimeout;
                let isScrolling = false;

                this.carousel.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    // 如果正在滚动中，忽略新的滚轮事件
                    if (isScrolling) return;

                    isScrolling = true;

                    // 根据滚轮方向决定切换方向
                    const direction = e.deltaY > 0 ? 'next' : 'prev';

                    // 执行切换
                    if (direction === 'next') {
                        this.next();
                    } else {
                        this.prev();
                    }

                    // 设置冷却时间，防止过快切换
                    setTimeout(() => {
                        isScrolling = false;
                    }, 800); // 800ms 冷却时间
                }, { passive: false });
            }

            updateCarousel() {
                const translateX = -this.currentIndex * 100;
                this.track.style.transform = `translateX(${translateX}vw)`;
                this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';

                // 更新指示器
                document.querySelectorAll('.indicator').forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === this.currentIndex);
                });

                // 添加页面切换动画效果
                this.addSlideTransitionEffect();

                console.log('Switched to slide:', this.currentIndex); // 调试信息
            }

            addSlideTransitionEffect() {
                const slides = document.querySelectorAll('.carousel-slide');
                slides.forEach((slide, index) => {
                    if (index === this.currentIndex) {
                        slide.style.opacity = '1';
                        slide.querySelector('.artwork-image-wrapper').style.animation = 'fadeInScale 0.6s ease-out';
                        slide.querySelector('.artwork-info-container').style.animation = 'slideInRight 0.6s ease-out 0.2s both';
                    } else {
                        slide.style.opacity = '0.7';
                    }
                });
            }

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex = this.currentIndex - 1;
                    this.updateCarousel();
                }
            }

            next() {
                if (this.currentIndex < artworks.length - 1) {
                    this.currentIndex = this.currentIndex + 1;
                    this.updateCarousel();
                }
            }

            goToSlide(index) {
                if (index >= 0 && index < artworks.length) {
                    this.currentIndex = index;
                    this.updateCarousel();
                }
            }
        }

        // 添加destroy方法到ImmersiveGallery原型
        ImmersiveGallery.prototype.destroy = function() {
            // 清理事件监听器
            document.removeEventListener('keydown', this.keydownHandler);
            if (this.touchStartHandler) {
                this.track.removeEventListener('touchstart', this.touchStartHandler);
                this.track.removeEventListener('touchmove', this.touchMoveHandler);
                this.track.removeEventListener('touchend', this.touchEndHandler);
            }
            if (this.wheelHandler) {
                this.track.removeEventListener('wheel', this.wheelHandler);
            }
        };

        // 初始化画廊
        document.addEventListener('DOMContentLoaded', () => {
            window.immersiveGallery = new ImmersiveGallery();
        });

        // 主题切换方法
        ImmersiveGallery.prototype.initTheme = function() {
            // 检查本地存储的主题设置
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const currentTheme = savedTheme || systemTheme;

            this.setTheme(currentTheme);
        };

        ImmersiveGallery.prototype.toggleTheme = function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            this.setTheme(newTheme);
        };

        ImmersiveGallery.prototype.setTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            // 更新图标
            this.themeIcon.textContent = theme === 'dark' ? '○' : '●';
        };

        // 策展数据存储
        let curationData = {
            emotion: '',
            userInput: '',
            artworks: [],
            introduction: '',
            conclusion: '',
            explanations: [],
            emotionCurve: null,
            isComplete: false
        };

        // 检查是否有情绪输入并获取策展数据
        const urlParams = new URLSearchParams(window.location.search);
        const emotion = urlParams.get('emotion');
        if (emotion) {
            curationData.emotion = emotion;
            document.getElementById('emotion-text').textContent = `情绪策展 · ${emotion}`;
            // 从画廊页面获取策展数据
            loadCurationData();
        } else {
            // 如果没有情绪参数，使用默认数据
            console.log('没有情绪参数，使用默认数据');
        }

        async function loadCurationData() {
            try {
                // 从localStorage获取策展数据（如果存在）
                const savedData = localStorage.getItem('curationData');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    curationData = { ...curationData, ...data };
                    console.log('加载策展数据:', curationData);
                    
                    // 如果有序言，优雅地显示序言
                    if (curationData.introduction) {
                        showIntroduction();
                    } else {
                        updateImmersiveGallery();
                    }
                    
                    // 如果策展数据不完整，继续监听后续数据
                    if (!curationData.isComplete) {
                        startBackgroundLoading();
                    }
                } else {
                    // 如果没有保存的数据，显示默认内容
                    console.log('没有找到策展数据，使用默认数据');
                }
            } catch (error) {
                console.error('加载策展数据失败:', error);
            }
        }

        function showIntroduction() {
            // 按照主页格式创建序言展示
            const introOverlay = document.createElement('div');
            introOverlay.className = 'intro-overlay';
            introOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: var(--bg-primary);
                z-index: 1000;
            `;
            
            // 清理序言内容，移除markdown格式
            const cleanIntroduction = curationData.introduction
                .replace(/^#\s*策展序言\s*\n\n/, '') // 移除标题
                .replace(/\n\n/g, ' ') // 替换换行为空格
                .trim();
            
            // 不要header，序言标题在引导问题位置，内容在输入框位置，按钮在按钮位置
            introOverlay.innerHTML = `
                <div class="gallery-container">
                    <div class="gallery-lighting"></div>
                    
                    <main class="main-content">
                        <div class="content-wrapper">
                            <div class="guide-question" id="intro-title" style="
                                font-size: 2rem;
                                font-weight: 300;
                                color: var(--text-primary);
                                margin-bottom: 2rem;
                                line-height: 1.4;
                                opacity: 0;
                                animation: fadeInUp 1s ease-out forwards;
                            ">序言</div>
                            
                            <div class="input-container">
                                <div id="intro-content" style="
                                    font-size: 1.1rem;
                                    color: var(--text-primary);
                                    margin-bottom: 2rem;
                                    text-align: center;
                                    line-height: 1.6;
                                ">${cleanIntroduction}</div>
                                
                                <button class="submit-button" id="start-btn" onclick="startImmersiveExperience()">
                                    观展
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            document.body.appendChild(introOverlay);
            
            // 获取内容元素
            const introContent = document.getElementById('intro-content');
            const startBtn = document.getElementById('start-btn');
            const fullText = introContent.textContent;
            
            // 先隐藏按钮，等流式输出完成后再显示
            startBtn.style.opacity = '0';
            startBtn.style.transform = 'translateY(20px)';
            startBtn.style.animation = 'none'; // 覆盖CSS动画
            
            // 设置固定位置和布局，防止流式输出时重新渲染
            introContent.style.minHeight = '200px';
            introContent.style.height = 'auto';
            introContent.style.overflow = 'hidden';
            introContent.style.position = 'relative';
            
            // 先清空内容，但保持固定位置和布局
            introContent.textContent = '';
            
            // 流式输出序言内容
            let currentIndex = 0;
            const totalTime = 5000; // 5秒总时间
            const interval = totalTime / fullText.length;
            
            const typeWriter = () => {
                if (currentIndex < fullText.length) {
                    // 在固定位置内逐字输出，不改变布局
                    introContent.textContent = fullText.substring(0, currentIndex + 1);
                    currentIndex++;
                    setTimeout(typeWriter, interval);
                } else {
                    // 序言输出完成，延迟显示按钮
                    setTimeout(() => {
                        startBtn.style.opacity = '1';
                        startBtn.style.transform = 'translateY(0)';
                    }, 1000);
                }
            };
            
            // 开始流式输出
            setTimeout(typeWriter, 300);
            
            // 添加按钮hover效果，与主页保持一致
            startBtn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
                this.style.boxShadow = '0 8px 25px rgba(0,0,0,0.2)';
            });
            
            startBtn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
                this.style.boxShadow = 'none';
            });
            
            // 添加开始体验的函数
            window.startImmersiveExperience = function() {
                introOverlay.remove();
                enableArtworkNavigation();
                updateImmersiveGallery();
            };
        }

        function enableArtworkNavigation() {
            // 启用作品导航功能
            console.log('作品导航已启用');
            // 这里可以添加启用导航的具体逻辑
        }

        function startBackgroundLoading() {
            console.log('开始后台加载监听...');
            let lastUpdateTime = Date.now();
            
            // 使用轮询检查localStorage更新
            const pollInterval = setInterval(() => {
                try {
                    const savedData = localStorage.getItem('curationData');
                    if (savedData) {
                        const newData = JSON.parse(savedData);
                        const newUpdateTime = newData.lastUpdate || 0;
                        
                        // 检查是否有新数据
                        if (newUpdateTime > lastUpdateTime || 
                            (newData.artworks && newData.artworks.length > curationData.artworks.length) ||
                            (newData.explanations && newData.explanations.length > curationData.explanations.length)) {
                            
                            curationData = { ...curationData, ...newData };
                            updateImmersiveGallery();
                            lastUpdateTime = newUpdateTime;
                            console.log('后台加载更新:', {
                                artworks: newData.artworks?.length || 0,
                                explanations: newData.explanations?.length || 0,
                                isComplete: newData.isComplete
                            });
                            
                            // 如果策展完成，停止轮询
                            if (newData.isComplete) {
                                clearInterval(pollInterval);
                                console.log('后台策展完成，停止轮询');
                            }
                        }
                    }
                } catch (error) {
                    console.error('后台数据检查失败:', error);
                }
            }, 2000); // 每2秒检查一次
            
            // 5分钟后停止轮询
            setTimeout(() => {
                clearInterval(pollInterval);
                console.log('后台加载超时，停止轮询');
            }, 300000);
        }

        function updateImmersiveGallery() {
            if (curationData.artworks && curationData.artworks.length > 0) {
                console.log('更新沉浸式画廊，策展数据:', curationData);
                
                // 更新artworks数组
                artworks.length = 0;
                artworks.push(...curationData.artworks);
                
                // 重新初始化画廊
                if (window.immersiveGallery) {
                    window.immersiveGallery.destroy();
                }
                
                // 重新初始化画廊
                window.immersiveGallery = new ImmersiveGallery();
                
                console.log('沉浸式画廊已更新，作品数量:', artworks.length);
            }
        }
    </script>
</body>
</html>
