<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtDuo - 沉浸画廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅色主题变量 */
            --bg-primary: #f5f5f4;
            --bg-secondary: #e7e5e4;
            --bg-tertiary: #d6d3d1;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #78716c;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.12);
            --btn-primary: linear-gradient(135deg, #1c1917 0%, #44403c 100%);
            --btn-text: #f5f5f4;
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --footer-bg: transparent;
            --footer-text: #1c1917;
        }

        [data-theme="dark"] {
            /* 深色主题变量 */
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #808080;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-primary: linear-gradient(135deg, #f5f5f4 0%, #e7e5e4 100%);
            --btn-text: #1c1917;
            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: rgba(255, 255, 255, 0.2);
            --modal-bg: #2d2d2d;
            --footer-bg: transparent;
            --footer-text: #d6d3d1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .gallery-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .gallery-lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent, rgba(68,64,60,0.1));
        }

        .header {
            padding: 2rem 0;
            text-align: center;
        }

        .header h1 {
            font-size: 1.6875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .content-wrapper {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            width: 100%;
        }

        .input-container {
            margin-bottom: 5rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .submit-button {
            margin-top: 1.5rem;
            padding: 0.875rem 2rem;
            background: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .artwork-description {
            margin-top: 0.375rem;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .gallery-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            z-index: 10;
            min-height: calc(100vh - 180px);
            overflow: visible;
        }

        .carousel-wrapper {
            width: 100vw;
            height: calc(100vh - 180px);
            overflow: visible;
        }

        .carousel {
            width: 100%;
            height: 100%;
            outline: none;
            position: relative;
            overflow: visible;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .carousel-slide {
            min-width: 100vw;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 180px);
            height: calc(100vh - 180px);
            padding-bottom: 0;
            overflow: visible;
        }

        /* 前言和结语页面样式 */
        .intro-slide, .conclusion-slide {
            min-width: 100vw;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 180px);
            height: calc(100vh - 180px);
            padding: 2rem;
            text-align: center;
        }

        .intro-content, .conclusion-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .intro-content h1, .conclusion-content h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-primary);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        .intro-content p, .conclusion-content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        .intro-buttons, .conclusion-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .intro-button, .conclusion-button {
            padding: 0.875rem 2rem;
            background: var(--btn-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        .intro-button:hover, .conclusion-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .artwork-image-container {
            flex-shrink: 0;
            margin-right: clamp(40px, 8vw, 140px);
        }

        .artwork-image-wrapper {
            position: relative;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .spotlight-effect {
            position: absolute;
            inset: -1rem;
            border-radius: 0;
            filter: blur(1rem);
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,218,185,0.3), transparent, transparent);
            transition: all 0.7s ease;
        }

        .artwork-image {
            position: relative;
            z-index: 10;
            width: clamp(280px, 35vw, 480px);
            height: clamp(350px, 43vw, 600px);
            object-fit: cover;
            border-radius: 0;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
            margin-bottom: 2rem;
            border: none;
            transition: opacity 0.3s ease;
        }

        /* 图片加载状态 */
        .artwork-image[loading="lazy"] {
            opacity: 0.7;
        }

        .artwork-image:not([src]) {
            background: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .frame-effect {
            position: absolute;
            inset: 0;
            border-radius: 0;
            pointer-events: none;
            border: none;
        }

        .artwork-info-container {
            flex-shrink: 0;
            width: clamp(320px, 25vw, 420px);
            animation: slideInRight 0.6s ease-out 0.2s both;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .artwork-info {
            width: 100%;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
            transform: scale(0.96);
        }

        .artwork-info-content {
            max-width: min(320px, 85%);
            margin: 0 auto;
            padding-top: 1.4375rem;
            padding-bottom: 1.4375rem;
        }

        .artwork-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .artwork-artist {
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .artwork-year {
            font-size: 0.625rem;
            margin-bottom: 1.25rem;
            color: var(--text-tertiary);
            transition: color 0.3s ease;
        }

        .artwork-description {
            line-height: 1.6;
            font-size: 0.625rem;
            color: var(--text-secondary);
            word-break: break-word;
            transition: color 0.3s ease;
        }

        .details-link {
            color: var(--text-primary);
            text-decoration: underline;
            cursor: pointer;
            margin-left: 0.5rem;
            font-size: 0.6rem;
            transition: opacity 0.3s ease;
        }

        .details-link:hover {
            opacity: 0.7;
        }

        /* 详情弹窗样式 */
        .artwork-details-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .artwork-details-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .artwork-details-content {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            margin: 1rem;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .artwork-details-modal.show .artwork-details-content {
            transform: scale(1);
        }

        .artwork-details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .artwork-details-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .artwork-details-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .artwork-details-close:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .artwork-details-body {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .artwork-details-body h3 {
            color: var(--text-primary);
            margin: 1.5rem 0 0.5rem 0;
            font-size: 1.1rem;
        }

        .artwork-details-body p {
            margin-bottom: 1rem;
        }

        .navigation-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 0;
            background: none;
            backdrop-filter: none;
            border-radius: 0;
            box-shadow: none;
        }

        .indicator {
            display: inline-block;
            width: 0.375rem;
            height: 0.375rem;
            border-radius: 9999px;
            background-color: var(--text-tertiary);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            opacity: 0.7;
        }

        .indicator:hover {
            background-color: var(--text-secondary);
            transform: scale(1.15);
            opacity: 0.9;
        }

        .indicator.active {
            background-color: var(--text-primary);
            transform: scale(1.3);
            opacity: 1;
            box-shadow: none;
        }

        .footer {
            padding: 1rem 0;
            position: relative;
            z-index: 10;
            background-color: var(--footer-bg);
            color: var(--footer-text);
            margin-top: auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .footer-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            text-align: center;
        }

        .footer p {
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }


        /* Responsive design */
        @media (max-width: 768px) {
            .carousel-slide {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }

            .artwork-image-container {
                margin-right: 0;
            }

            .artwork-info-container {
                width: 100%;
                max-width: 320px;
            }

            .artwork-image {
                width: clamp(200px, 60vw, 300px);
                height: clamp(250px, 75vw, 375px);
            }

            .artwork-title {
                font-size: 1rem;
            }

            .artwork-artist {
                font-size: 0.625rem;
            }

            .artwork-description {
                font-size: 0.5625rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-lighting"></div>

        <header class="header">
            <div class="header-content">
                <h1>ArtDuo</h1>
                <p id="emotion-text">沉浸画廊 · 探索之旅</p>
            </div>
        </header>

        <div class="gallery-content">
            <div class="carousel-wrapper">
                <div class="carousel" tabindex="0" id="carousel">
                    <div class="carousel-track" id="carousel-track">
                        <!-- Slides will be dynamically generated -->
                    </div>
                </div>
            </div>

            <div class="navigation-indicators" id="indicators">
                <!-- Indicators will be dynamically generated -->
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>LessLand · ArtDuo</p>
            </div>
        </footer>
    </div>


    <script>
        // 画作数据 - 从策展数据动态加载
        let artworks = [];
        
        // 确保artworks数组在全局作用域中可访问
        window.artworks = artworks;

        class ImmersiveGallery {
            constructor() {
                this.currentIndex = 0;
                this.carousel = document.getElementById('carousel');
                this.track = document.getElementById('carousel-track');
                this.indicators = document.getElementById('indicators');

                // 触摸相关变量
                this.startX = 0;
                this.endX = 0;
                this.touchStartTime = 0;
                this.isDragging = false;
                this.startTranslate = 0;
                this.currentTranslate = 0;
                this.carouselWidth = 0;

                this.init();
            }

            init() {
                this.renderSlides();
                this.renderIndicators();
                this.setupEventListeners();
                this.updateCarousel();
                this.initTheme();
            }

            renderSlides() {
                let slidesHTML = '';
                
                // 1. 前言页面
                if (curationData.introduction) {
                    slidesHTML += `
                        <div class="carousel-slide intro-slide">
                            <div class="intro-content">
                                <h1>序言</h1>
                                <p>${curationData.introduction.replace(/^#\s*策展序言\s*\n\n/, '').replace(/\n\n/g, ' ').trim()}</p>
                                <div class="intro-buttons">
                                    <button class="intro-button" onclick="window.immersiveGallery.next()">开始观展</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // 2. 艺术作品页面（由情绪曲线设计决定数量）
                const maxArtworks = this.getOptimalArtworkCount();
                for (let i = 0; i < maxArtworks; i++) {
                    const artwork = artworks[i];
                    slidesHTML += `
                        <div class="carousel-slide">
                            <div class="artwork-image-container">
                                <div class="artwork-image-wrapper">
                                    <div class="spotlight-effect"></div>
                                    <img
                                        src="${artwork.imageUrl}"
                                        alt="${artwork.title}"
                                        class="artwork-image"
                                        loading="lazy"
                                        onerror="handleImageError(this, '${artwork.id}')"
                                        onload="handleImageLoad(this, '${artwork.id}')"
                                    >
                                    <div class="frame-effect"></div>
                                </div>
                            </div>
                            <div class="artwork-info-container">
                                <div class="artwork-info">
                                    <div class="artwork-info-content">
                                        <h2 class="artwork-title">${artwork.title}</h2>
                                        <p class="artwork-artist">${artwork.artist}</p>
                                        <p class="artwork-year">${artwork.year}</p>
                                        <p class="artwork-description" onclick="showArtworkDetails('${artwork.id}')" style="cursor: pointer; text-decoration: underline;">${artwork.description}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // 3. 结语页面
                if (curationData.conclusion) {
                    slidesHTML += `
                        <div class="carousel-slide conclusion-slide">
                            <div class="conclusion-content">
                                <h1>结语</h1>
                                <p>${curationData.conclusion}</p>
                                <div class="conclusion-buttons">
                                    <button class="conclusion-button" onclick="window.immersiveGallery.prev()">返回观展</button>
                                    <button class="conclusion-button" onclick="window.location.href='/gallery?emotion=${encodeURIComponent(curationData.emotion)}'">回顾</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                this.track.innerHTML = slidesHTML;
            }

            renderIndicators() {
                // 计算总页面数：前言(1) + 作品(最多9) + 结语(1) = 最多11个
                const totalSlides = this.getTotalSlides();
                let indicatorsHTML = '';
                
                for (let i = 0; i < totalSlides; i++) {
                    const isActive = i === this.currentIndex;
                    let label = '';
                    
                    if (i === 0 && curationData.introduction) {
                        label = '序言';
                    } else if (i === totalSlides - 1 && curationData.conclusion) {
                        label = '结语';
                    } else {
                        const artworkIndex = curationData.introduction ? i - 1 : i;
                        label = `第 ${artworkIndex + 1} 幅画`;
                    }
                    
                    indicatorsHTML += `
                        <span class="indicator ${isActive ? 'active' : ''}" data-index="${i}" role="button" tabindex="0" aria-label="${label}"></span>
                    `;
                }
                
                this.indicators.innerHTML = indicatorsHTML;
                console.log('Navigation indicators rendered:', this.indicators.innerHTML);
            }

            getTotalSlides() {
                let total = 0;
                if (curationData.introduction) total += 1; // 前言
                total += this.getOptimalArtworkCount(); // 由情绪曲线决定的作品数量
                if (curationData.conclusion) total += 1; // 结语
                return total;
            }

            getOptimalArtworkCount() {
                // 优先从情绪曲线设计获取推荐的作品数量
                if (curationData.emotionCurve && curationData.emotionCurve.recommendedArtworkCount) {
                    const recommendedCount = curationData.emotionCurve.recommendedArtworkCount;
                    const actualCount = Math.min(recommendedCount, window.artworks.length);
                    console.log('使用情绪曲线设计推荐的作品数量:', recommendedCount, '实际可用:', actualCount);
                    return actualCount;
                }
                
                // 如果没有推荐数量，使用情绪旅程长度
                if (curationData.emotionCurve && curationData.emotionCurve.emotionJourney) {
                    const journeyLength = curationData.emotionCurve.emotionJourney.length;
                    if (journeyLength > 0) {
                        console.log('使用情绪曲线旅程长度:', journeyLength);
                        return Math.min(journeyLength, window.artworks.length);
                    }
                }
                
                // 最后降级：根据情绪复杂度智能判断
                const emotion = curationData.emotion || '';
                const userInput = curationData.userInput || '';
                
                // 复杂情绪主题需要更多作品
                const complexEmotions = ['复杂', '深度', '矛盾', '纠结', '焦虑', '抑郁', '愤怒', '痛苦'];
                const simpleEmotions = ['简单', '轻松', '快乐', '平静', '满足', '愉悦'];
                
                const isComplex = complexEmotions.some(e => emotion.includes(e) || userInput.includes(e));
                const isSimple = simpleEmotions.some(e => emotion.includes(e) || userInput.includes(e));
                
                let optimalCount;
                if (isComplex) {
                    optimalCount = Math.min(12, window.artworks.length); // 复杂主题需要更多作品
                    console.log('复杂情绪主题，选择', optimalCount, '件作品');
                } else if (isSimple) {
                    optimalCount = Math.min(6, window.artworks.length); // 简单主题可以更少
                    console.log('简单情绪主题，选择', optimalCount, '件作品');
                } else {
                    optimalCount = Math.min(9, window.artworks.length); // 默认9件
                    console.log('默认主题，选择', optimalCount, '件作品');
                }
                
                return optimalCount;
            }

            setupEventListeners() {
                // 键盘导航 - 全局监听，确保一定工作
                document.addEventListener('keydown', (e) => {
                    console.log('Key pressed:', e.key); // 调试信息

                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        e.stopPropagation();

                        if (e.key === 'ArrowLeft') {
                            console.log('Going to previous slide');
                            this.prev();
                        } else {
                            console.log('Going to next slide');
                            this.next();
                        }
                    }
                }, true); // 使用捕获阶段

                // 指示器点击
                this.indicators.addEventListener('click', (e) => {
                    if (e.target.classList.contains('indicator')) {
                        const index = parseInt(e.target.dataset.index);
                        console.log('Indicator clicked:', index);
                        this.goToSlide(index);
                    }
                });

                // 指示器键盘控制
                this.indicators.addEventListener('keydown', (e) => {
                    if (e.target.classList.contains('indicator') && (e.key === 'Enter' || e.key === ' ')) {
                        e.preventDefault();
                        const index = parseInt(e.target.dataset.index);
                        console.log('Indicator activated via keyboard:', index);
                        this.goToSlide(index);
                    }
                });

                // 增强的触摸滑动支持
                this.setupTouchEvents();

                // 鼠标滚轮支持
                this.setupWheelEvents();

            }

            setupTouchEvents() {
                this.carousel.addEventListener('touchstart', (e) => {
                    this.startX = e.touches[0].clientX;
                    this.touchStartTime = Date.now();
                    this.isDragging = true;
                    this.carouselWidth = window.innerWidth;
                    this.startTranslate = -this.currentIndex * this.carouselWidth;

                    // 阻止默认行为以获得更好的控制
                    e.preventDefault();
                }, { passive: false });

                this.carousel.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;

                    const currentX = e.touches[0].clientX;
                    const diff = currentX - this.startX;
                    this.currentTranslate = this.startTranslate + diff;

                    // 应用实时拖动效果
                    this.track.style.transition = 'none';
                    this.track.style.transform = `translateX(${this.currentTranslate}px)`;

                    e.preventDefault();
                }, { passive: false });

                this.carousel.addEventListener('touchend', (e) => {
                    if (!this.isDragging) return;

                    this.isDragging = false;
                    this.endX = e.changedTouches[0].clientX;
                    const diff = this.startX - this.endX;
                    const touchDuration = Date.now() - this.touchStartTime;

                    // 计算滑动速度和距离
                    const speed = Math.abs(diff) / touchDuration;
                    const minSwipeDistance = 50;
                    const minSwipeSpeed = 0.3;

                    this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';

                    // 判断是否需要切换页面
                    if (Math.abs(diff) > minSwipeDistance || speed > minSwipeSpeed) {
                        if (diff > 0) {
                            this.next();
                        } else {
                            this.prev();
                        }
                    } else {
                        // 回到原位
                        this.updateCarousel();
                    }
                });

                // 防止触摸事件冒泡
                this.carousel.addEventListener('touchcancel', () => {
                    this.isDragging = false;
                    this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    this.updateCarousel();
                });
            }

            setupWheelEvents() {
                let wheelTimeout;
                let isScrolling = false;

                this.carousel.addEventListener('wheel', (e) => {
                    e.preventDefault();

                    // 如果正在滚动中，忽略新的滚轮事件
                    if (isScrolling) return;

                    isScrolling = true;

                    // 根据滚轮方向决定切换方向
                    const direction = e.deltaY > 0 ? 'next' : 'prev';

                    // 执行切换
                    if (direction === 'next') {
                        this.next();
                    } else {
                        this.prev();
                    }

                    // 设置冷却时间，防止过快切换
                    setTimeout(() => {
                        isScrolling = false;
                    }, 800); // 800ms 冷却时间
                }, { passive: false });
            }

            updateCarousel() {
                const translateX = -this.currentIndex * 100;
                this.track.style.transform = `translateX(${translateX}vw)`;
                this.track.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';

                // 更新指示器
                document.querySelectorAll('.indicator').forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === this.currentIndex);
                });
                
                // 智能预加载相邻图片
                if (window.artworks.length > 0) {
                    preloadImages(window.artworks, this.currentIndex);
                }

                // 添加页面切换动画效果
                this.addSlideTransitionEffect();

                console.log('Switched to slide:', this.currentIndex, 'of', this.getTotalSlides()); // 调试信息
            }

            addSlideTransitionEffect() {
                const slides = document.querySelectorAll('.carousel-slide');
                slides.forEach((slide, index) => {
                    if (index === this.currentIndex) {
                        slide.style.opacity = '1';
                        
                        // 为艺术作品页面添加动画
                        const imageWrapper = slide.querySelector('.artwork-image-wrapper');
                        const infoContainer = slide.querySelector('.artwork-info-container');
                        if (imageWrapper) {
                            imageWrapper.style.animation = 'fadeInScale 0.6s ease-out';
                        }
                        if (infoContainer) {
                            infoContainer.style.animation = 'slideInRight 0.6s ease-out 0.2s both';
                        }
                        
                        // 为前言和结语页面添加动画
                        const introContent = slide.querySelector('.intro-content');
                        const conclusionContent = slide.querySelector('.conclusion-content');
                        if (introContent || conclusionContent) {
                            slide.style.animation = 'fadeInUp 0.6s ease-out';
                        }
                    } else {
                        slide.style.opacity = '0.7';
                    }
                });
            }

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex = this.currentIndex - 1;
                    this.updateCarousel();
                }
            }

            next() {
                const totalSlides = this.getTotalSlides();
                if (this.currentIndex < totalSlides - 1) {
                    this.currentIndex = this.currentIndex + 1;
                    this.updateCarousel();
                }
            }

            goToSlide(index) {
                const totalSlides = this.getTotalSlides();
                if (index >= 0 && index < totalSlides) {
                    this.currentIndex = index;
                    this.updateCarousel();
                }
            }

        }

        // 添加destroy方法到ImmersiveGallery原型
        ImmersiveGallery.prototype.destroy = function() {
            // 清理事件监听器
            document.removeEventListener('keydown', this.keydownHandler);
            if (this.touchStartHandler) {
                this.track.removeEventListener('touchstart', this.touchStartHandler);
                this.track.removeEventListener('touchmove', this.touchMoveHandler);
                this.track.removeEventListener('touchend', this.touchEndHandler);
            }
            if (this.wheelHandler) {
                this.track.removeEventListener('wheel', this.wheelHandler);
            }
        };

        // 初始化画廊 - 等待策展数据加载
        document.addEventListener('DOMContentLoaded', () => {
            // 不立即初始化，等待策展数据加载完成
            console.log('页面加载完成，等待策展数据...');
        });

        // 主题继承方法
        ImmersiveGallery.prototype.initTheme = function() {
            // 检查本地存储的主题设置
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const currentTheme = savedTheme || systemTheme;

            this.setTheme(currentTheme);
        };

        ImmersiveGallery.prototype.setTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        };

        // 图片加载优化和错误处理（使用统一工具函数）
        const imageCache = new Map();
        const imageLoadQueue = [];
        const maxConcurrentLoads = 3;
        let currentLoads = 0;

        // 备用图片列表
        const FALLBACK_IMAGES = [
            'https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=800&h=600&fit=crop',
            'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&h=600&fit=crop',
            'https://images.unsplash.com/photo-1561736778-92e52a7769ef?w=800&h=600&fit=crop'
        ];

        // 图片错误处理
        function handleImageError(img, artworkId) {
            console.warn(`图片加载失败: ${artworkId}`, img.src);
            
            const randomFallback = FALLBACK_IMAGES[Math.floor(Math.random() * FALLBACK_IMAGES.length)];
            img.src = randomFallback;
            img.style.opacity = '0.7';
            img.title = '图片加载失败，显示备用图片';
        }

        // 图片加载成功处理
        function handleImageLoad(img, artworkId) {
            console.log(`图片加载成功: ${artworkId}`);
            img.style.opacity = '1';
            
            // 缓存成功加载的图片
            imageCache.set(artworkId, {
                src: img.src,
                loaded: true,
                timestamp: Date.now()
            });
        }

        // 智能预加载策略
        function preloadImages(artworks, currentIndex) {
            const preloadRange = 2; // 预加载当前图片前后2张
            const startIndex = Math.max(0, currentIndex - preloadRange);
            const endIndex = Math.min(window.artworks.length - 1, currentIndex + preloadRange);
            
            for (let i = startIndex; i <= endIndex; i++) {
                if (i !== currentIndex && !imageCache.has(artworks[i].id)) {
                    queueImageLoad(artworks[i]);
                }
            }
        }

        // 图片加载队列管理
        function queueImageLoad(artwork) {
            if (imageCache.has(artwork.id)) return;
            
            imageLoadQueue.push(artwork);
            processImageQueue();
        }

        // 处理图片加载队列
        function processImageQueue() {
            if (currentLoads >= maxConcurrentLoads || imageLoadQueue.length === 0) {
                return;
            }
            
            const artwork = imageLoadQueue.shift();
            currentLoads++;
            
            const img = new Image();
            img.onload = () => {
                imageCache.set(artwork.id, {
                    src: img.src,
                    loaded: true,
                    timestamp: Date.now()
                });
                currentLoads--;
                processImageQueue();
            };
            
            img.onerror = () => {
                console.warn(`预加载失败: ${artwork.id}`);
                currentLoads--;
                processImageQueue();
            };
            
            img.src = artwork.imageUrl;
        }

        // 策展数据存储
        let curationData = {
            emotion: '',
            userInput: '',
            artworks: [],
            introduction: '',
            conclusion: '',
            explanations: [],
            emotionCurve: null,
            curationIntent: null,
            isComplete: false
        };

        // 详情弹窗功能
        function showArtworkDetails(artworkId) {
            const artwork = window.artworks.find(a => a.id === artworkId);
            if (!artwork) return;

            // 从已接收的讲解中注入简介与详情
            const exp = (curationData.explanations || []).find(e => e.artworkId === artworkId);
            const introText = (() => {
                if (exp && exp.explanation && exp.explanation.emotionalConnection) {
                    const txt = String(exp.explanation.emotionalConnection).trim();
                    const firstSentence = txt.split(/。|\.|!|！|\?|？/)[0] || txt;
                    return firstSentence.length > 0 ? firstSentence : txt;
                }
                return artwork.description || '这件作品的简介即将生成。';
            })();
            const detailText = (() => {
                // 详情优先取统一“details”承载字段（当前复用 artisticAnalysis 作为详情容器）
                const d = exp?.explanation?.artisticAnalysis || '';
                return d || '';
            })();

            // 创建弹窗HTML
            const modalHTML = `
                <div class="artwork-details-modal" id="artwork-details-modal">
                    <div class="artwork-details-content">
                        <div class="artwork-details-header">
                            <h2 class="artwork-details-title">${artwork.title}</h2>
                            <button class="artwork-details-close" onclick="closeArtworkDetails()">&times;</button>
                        </div>
                        <div class="artwork-details-body">
                            <p><strong>艺术家：</strong>${artwork.artist}</p>
                            <p><strong>创作年份：</strong>${artwork.year}</p>
                            <p><strong>材质：</strong>${artwork.medium}</p>
                            <p><strong>尺寸：</strong>${artwork.dimensions}</p>
                            <p><strong>收藏地：</strong>${artwork.museum}</p>
                            
                            <h3>作品简介</h3>
                            <p>${introText}</p>
                            
                            ${exp && detailText ? `
                                <h3>详情</h3>
                                <p>${detailText}</p>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            // 添加到页面
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            
            // 显示弹窗
            const modal = document.getElementById('artwork-details-modal');
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);

            // 点击背景关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeArtworkDetails();
                }
            });

            // ESC键关闭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeArtworkDetails();
                }
            });
        }

        function closeArtworkDetails() {
            const modal = document.getElementById('artwork-details-modal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.remove();
                }, 300);
            }
        }

        // 检查是否有情绪输入并获取策展数据
        const urlParams = new URLSearchParams(window.location.search);
        const emotion = urlParams.get('emotion');
        const subtitle = urlParams.get('subtitle');
        if (emotion) {
            curationData.emotion = emotion;
            // 使用LLM生成的副标题，如果没有则使用降级处理
            const displaySubtitle = subtitle || '沉浸画廊 · 探索之旅';
            document.getElementById('emotion-text').textContent = displaySubtitle;
            // 从画廊页面获取策展数据
            loadCurationData();
        } else {
            // 如果没有情绪参数，使用默认数据
            console.log('没有情绪参数，使用默认数据');
        }

        async function loadCurationData() {
            try {
                // 从localStorage获取策展数据（如果存在）
                const savedData = localStorage.getItem('curationData');
                if (savedData) {
                    const data = JSON.parse(savedData);

                    // 检查缓存数据是否匹配当前的 emotion
                    if (data.emotion === curationData.emotion && data.artworks && data.artworks.length > 0) {
                        curationData = { ...curationData, ...data };
                        console.log('✅ 使用缓存的策展数据:', curationData);

                        // 直接显示画廊（前言已集成到轮播中）
                        updateImmersiveGallery();

                        // 如果策展数据不完整，继续监听后续数据
                        if (!curationData.isComplete) {
                            startBackgroundLoading();
                        }
                    } else {
                        // 缓存数据不匹配或不完整，清除并启动新的策展流程
                        console.log('🔄 缓存数据不匹配或不完整，清除并重新策展');
                        localStorage.removeItem('curationData');
                        await startCurationProcess();
                    }
                } else {
                    // 如果没有保存的数据，启动策展流程
                    console.log('🚀 没有找到策展数据，启动策展流程');
                    await startCurationProcess();
                }
            } catch (error) {
                console.error('❌ 加载策展数据失败:', error);
                // 如果出错，清除缓存并启动策展流程
                localStorage.removeItem('curationData');
                await startCurationProcess();
            }
        }

        async function startCurationProcess() {
            try {
                console.log('🚀 启动策展流程...');
                
                // 显示加载状态
                document.getElementById('emotion-text').textContent = '正在策展中...';
                
                // 启动策展流式输出
                const response = await fetch('/api/curate/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        emotion: curationData.emotion,
                        userInput: curationData.userInput || ''
                    })
                });

                if (!response.ok) {
                    throw new Error(`策展请求失败: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                handleCurationEvent(data);
                            } catch (e) {
                                console.warn('解析策展数据失败:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('❌ 策展流程失败:', error);
                // 显示错误信息
                document.getElementById('emotion-text').textContent = '策展失败，请刷新重试';
                // 不再回退到 mock 数据，让用户知道发生了错误
            }
        }

        function handleCurationEvent(data) {
            console.log('收到策展事件:', data);
            
            switch (data.type) {
                case 'curation_intent':
                    curationData.curationIntent = data.payload;
                    console.log('收到策展意图:', curationData.curationIntent);
                    updateImmersiveGallery();
                    break;
                
                case 'emotion_curve':
                    curationData.emotionCurve = data.payload;
                    break;
                
                case 'artworks_selected':
                    curationData.artworks = data.payload?.artworks || [];
                    console.log('收到艺术作品:', curationData.artworks.length, '件');
                    updateImmersiveGallery();
                    break;
                
                case 'introduction':
                    curationData.introduction = data.payload?.introduction || '';
                    console.log('收到序言:', curationData.introduction);
                    updateImmersiveGallery();
                    break;
                
                case 'conclusion':
                    curationData.conclusion = data.payload?.conclusion || '';
                    console.log('收到结语:', curationData.conclusion);
                    break;
                
                case 'artwork_batch_chunk':
                    const batchExplanations = data.payload?.explanations || [];
                    if (batchExplanations.length > 0) {
                        curationData.explanations.push(...batchExplanations);
                        console.log('收到批次讲解:', batchExplanations.length, '个');
                        updateImmersiveGallery();
                    } else {
                        console.warn('批次讲解为空:', data.payload);
                    }
                    break;
                
                case 'explanations_batch':
                    const explanations = data.payload?.explanations || [];
                    curationData.explanations.push(...explanations);
                    console.log('收到讲解:', explanations.length, '个');
                    break;
                
                case 'complete':
                    curationData.isComplete = true;
                    curationData.lastUpdate = Date.now();
                    localStorage.setItem('curationData', JSON.stringify(curationData));
                    console.log('策展完成');
                    break;
            }
        }


        function startBackgroundLoading() {
            console.log('开始后台加载监听...');
            let lastUpdateTime = Date.now();
            
            // 使用轮询检查localStorage更新
            const pollInterval = setInterval(() => {
                try {
                    const savedData = localStorage.getItem('curationData');
                    if (savedData) {
                        const newData = JSON.parse(savedData);
                        const newUpdateTime = newData.lastUpdate || 0;
                        
                        // 检查是否有新数据
                        if (newUpdateTime > lastUpdateTime || 
                            (newData.artworks && newData.artworks.length > curationData.artworks.length) ||
                            (newData.explanations && newData.explanations.length > curationData.explanations.length)) {
                            
                            const oldExplanationCount = curationData.explanations?.length || 0;
                            curationData = { ...curationData, ...newData };
                            updateImmersiveGallery();
                            lastUpdateTime = newUpdateTime;
                            
                            const newExplanationCount = newData.explanations?.length || 0;
                            const isFirstBatch = (oldExplanationCount === 0 && newExplanationCount >= 2);
                            
                            console.log('后台加载更新:', {
                                artworks: newData.artworks?.length || 0,
                                explanations: newExplanationCount,
                                isComplete: newData.isComplete,
                                isFirstBatch: isFirstBatch ? '(第一批讲解完成)' : ''
                            });
                            
                            // 如果策展完成，停止轮询
                            if (newData.isComplete) {
                                clearInterval(pollInterval);
                                console.log('后台策展完成，停止轮询');
                            }
                        }
                    }
                } catch (error) {
                    console.error('后台数据检查失败:', error);
                }
            }, 2000); // 每2秒检查一次
            
            // 5分钟后停止轮询
            setTimeout(() => {
                clearInterval(pollInterval);
                console.log('后台加载超时，停止轮询');
            }, 300000);
        }

        function updateImmersiveGallery() {
            console.log('updateImmersiveGallery 被调用，策展数据:', curationData);
            if (curationData.artworks && curationData.artworks.length > 0) {
                console.log('✅ 使用真实策展数据，作品数量:', curationData.artworks.length);

                // 更新全局artworks数组
                window.artworks.length = 0;
                window.artworks.push(...curationData.artworks);

                // 如果画廊已存在，销毁它
                if (window.immersiveGallery) {
                    window.immersiveGallery.destroy();
                }

                // 初始化画廊
                window.immersiveGallery = new ImmersiveGallery();

                console.log('✅ 沉浸式画廊已更新，作品数量:', window.artworks.length);
            } else {
                console.log('⏳ 策展数据未准备好，等待API返回...');
                // 不再使用 mock 数据，而是显示加载状态
                // 保持页面等待状态，直到真实数据到达
            }
        }
    </script>
